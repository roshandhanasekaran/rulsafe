# C-MAPSS FD001 demo.
# rulsafe data fetch cmapss writes these files from the NASA archive.
# The headline score is the last observation of each official test engine
# against fd001_official_rul.txt. That file is not a training label.
# Validation for the protocol is the last pre-failure cycle of the held-out
# training engines. Early stopping uses every causal row of those engines.
# The per-row scores on the held-out training engines are the secondary view.
# target.rul_cap 125 is the piecewise cap from the C-MAPSS example.
# The NASA catalog does not state a licence. A separate Zenodo record uses
# CC BY 4.0 for that record only. Do not merge those statements.

project:
  name: cmapss-fd001-completed-trajectory
  seed: 7
  notes: >
    Official FD001 last-observation benchmark against RUL_FD001.txt, with a
    piecewise RUL cap of 125. Held-out training engines supply validation.
    The per-row training holdout is secondary. The RUL file is not a training
    label. Licence is not specified on the NASA catalog page.
    Zenodo doi:10.5281/zenodo.15346912 states CC BY 4.0 for that record only.

connector:
  type: files
  assets: data/cmapss/fd001_assets.parquet
  signals: data/cmapss/fd001_signals.parquet
  events: data/cmapss/fd001_events.parquet

assets:
  id_column: unit_id
  extra_columns: []

signals:
  id_column: unit_id
  event_time_column: cycle
  available_at_column: null
  timestamp_type: cycle
  feature_columns: auto
  exclude_columns: []
  frequency: null
  gap_policy: none
  max_gap: null

events:
  id_column: unit_id
  event_time_column: cycle
  available_at_column: null
  type_column: event_type
  terminal_types:
    - failure
  competing_types:
    - censored
  forbidden_as_features: []

contract:
  observation_start_column: null
  observation_end_column: null
  replacement_starts_new_episode: true
  replacement_types: []

labeling:
  task: completed_trajectory_rul
  horizon: null
  unit: cycles
  censored_policy: report

target:
  rul_cap: 125

windows:
  lookback: 16
  stride: 1
  discard_straddle_split: true

split:
  protocol: official_partitions
  official_partitions:
    train_ids: data/cmapss/fd001_train_ids.txt
    validation_ids: data/cmapss/fd001_validation_ids.txt
    test_ids: data/cmapss/fd001_test_ids.txt

preprocessing:
  clip_percentiles: [1, 99]
  scaler: standard

leakage:
  fail_on:
    - random_split
    - future_labels
    - future_in_features
    - post_event_features
    - delayed_record_leak
    - interpolation_leak
    - entity_leakage
    - scaler_leakage
    - target_in_features
    - event_metadata_in_features
    - silent_negative_censoring
    - unsupported_history
    - replacement_episode_mix
    - test_used_for_choices
    - official_hidden_label_reconstruction
  warn_on:
    - high_association_with_label
    - backend_internal_split
  association_warn_threshold: 0.85

models:
  include:
    - constant
    - hist_gradient_boosting

evaluation:
  threshold_split: validation
  report_split_order:
    - train
    - validation
    - test
  plots:
    - prediction_error
    - error_by_unit
    - history_dispositions
  official_benchmark:
    protocol: fd001_last_observation
    rul_path: data/cmapss/fd001_official_rul.txt

report:
  formats:
    - html
    - json
  title: "C-MAPSS FD001 completed-trajectory check"
  output_dir: ./rulsafe-runs
