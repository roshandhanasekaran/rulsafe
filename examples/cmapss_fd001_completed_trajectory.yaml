# C-MAPSS FD001 is a completed-trajectory demo, not a typical censored fleet.
# Score test engines at the last observation only.
# The NASA catalog does not state a licence. A separate Zenodo record uses CC BY 4.0
# for that record only. Do not merge those statements.

project:
  name: cmapss-fd001-last-observation
  seed: 7
  notes: >
    Completed-trajectory demo. Licence is not specified on the NASA catalog page.
    Zenodo doi:10.5281/zenodo.15346912 states CC BY 4.0 for that record only.

connector:
  type: files
  assets: data/cmapss/fd001_assets.parquet
  signals: data/cmapss/fd001_signals.parquet
  events: data/cmapss/fd001_events.parquet

assets:
  id_column: unit_id
  extra_columns: []

signals:
  id_column: unit_id
  event_time_column: cycle
  available_at_column: null
  timestamp_type: cycle
  feature_columns: auto
  exclude_columns: []
  frequency: null
  gap_policy: none
  max_gap: null

events:
  id_column: unit_id
  event_time_column: cycle
  available_at_column: null
  type_column: event_type
  terminal_types:
    - failure
  competing_types: []
  forbidden_as_features: []

contract:
  observation_start_column: null
  observation_end_column: null
  replacement_starts_new_episode: true
  replacement_types: []

labeling:
  task: cmapss_last_observation
  horizon: null
  unit: cycles
  censored_policy: reject

windows:
  lookback: 16
  stride: 1
  discard_straddle_split: true

split:
  protocol: official_partitions
  official_partitions:
    train_ids: data/cmapss/fd001_train_ids.txt
    validation_ids: data/cmapss/fd001_validation_ids.txt
    test_ids: data/cmapss/fd001_test_ids.txt

preprocessing:
  clip_percentiles: [1, 99]
  scaler: standard

leakage:
  fail_on:
    - random_split
    - future_labels
    - future_in_features
    - post_event_features
    - delayed_record_leak
    - interpolation_leak
    - entity_leakage
    - scaler_leakage
    - target_in_features
    - event_metadata_in_features
    - silent_negative_censoring
    - unsupported_history
    - replacement_episode_mix
    - test_used_for_choices
    - official_hidden_label_reconstruction
  warn_on:
    - high_association_with_label
    - backend_internal_split
  association_warn_threshold: 0.85

models:
  include:
    - constant
    - hist_gradient_boosting

evaluation:
  threshold_split: validation
  report_split_order:
    - train
    - validation
    - test
  plots:
    - prediction_error
    - error_by_unit
    - history_dispositions

report:
  formats:
    - html
    - json
  title: "C-MAPSS FD001 last-observation check"
  output_dir: ./rulsafe-runs
