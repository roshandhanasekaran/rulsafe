name: CI

"on":
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the audited lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev-3.12.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Install from the audited lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev-${{ matrix.python-version }}.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Pytest
        run: pytest

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the audited lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev-3.12.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Bandit
        run: bandit -c .bandit -r src
      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Gitleaks full history
        run: gitleaks detect --source . --log-opts=--all --redact --verbose --no-banner

  audit-lockfile:
    name: Audit lock on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the audited lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev-${{ matrix.python-version }}.lock
      - name: Audit the lock for this interpreter
        run: |
          pip-audit \
            --requirement "requirements/dev-${{ matrix.python-version }}.lock" \
            --disable-pip \
            --require-hashes \
            --progress-spinner=off

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the audited lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev-3.12.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build
        run: python -m build --no-isolation
      - name: Check the wheel has no dataset files
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {wheels}")
          names = zipfile.ZipFile(wheels[0]).namelist()
          forbidden = [
              name
              for name in names
              if name.endswith((".parquet", ".csv", ".zip", ".7z"))
          ]
          if forbidden:
              raise SystemExit(f"Dataset-like files in the wheel: {forbidden}")
          if not any(name.endswith("py.typed") for name in names):
              raise SystemExit("py.typed is missing from the wheel")
          print(wheels[0])
          PY
      - name: Test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/rulsafe-wheel"
          "$RUNNER_TEMP/rulsafe-wheel/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "$GITHUB_WORKSPACE/requirements/dev-3.12.lock"
          "$RUNNER_TEMP/rulsafe-wheel/bin/python" -m pip install \
            --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/rulsafe-wheel/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed_distribution.py"
      - name: Generate audited build-environment SBOM
        run: |
          pip-audit --requirement requirements/dev-3.12.lock \
            --disable-pip --require-hashes --progress-spinner=off \
            --format cyclonedx-json --output dist/sbom-build-python-3.12.cdx.json
      - name: Hash candidate artifacts
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          directory = Path("dist")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in sorted(directory.iterdir())
              if path.is_file() and path.name != "SHA256SUMS"
          ]
          (directory / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Retain private candidate artifacts (no publishing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rulsafe-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
