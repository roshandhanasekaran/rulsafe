name: Publish release

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the audited build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/dev-3.12.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Require the tag to match the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = f"v{version('rulsafe')}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must equal {expected!r}")
          PY
      - name: Install Gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Verify the exact release tag
        run: |
          ruff check .
          ruff format --check .
          mypy src
          bandit -c .bandit -r src
          gitleaks detect --source . --log-opts=--all --redact --verbose --no-banner
          pytest
          pip-audit --requirement requirements/dev-3.12.lock \
            --disable-pip --require-hashes --progress-spinner=off
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Inspect and install the wheel
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist: {wheels=}, {sdists=}")
          names = zipfile.ZipFile(wheels[0]).namelist()
          forbidden = [
              name for name in names if name.endswith((".parquet", ".csv", ".zip", ".7z"))
          ]
          if forbidden:
              raise SystemExit(f"Dataset-like files in wheel: {forbidden}")
          required = {
              "rulsafe/py.typed",
              "rulsafe/demo_configs/cmapss_fd001_completed_trajectory.yaml",
              "rulsafe/demo_configs/synthetic_fleet.yaml",
          }
          missing = required - set(names)
          if missing:
              raise SystemExit(f"Required wheel files are missing: {sorted(missing)}")
          PY
          python -m venv "${RUNNER_TEMP}/rulsafe-release-wheel"
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements/dev-3.12.lock
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" -m pip install \
            --no-deps dist/*.whl
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" \
            scripts/check_installed_distribution.py
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" -m pip check
      - name: Generate release evidence
        run: |
          mkdir release-evidence
          pip-audit --requirement requirements/dev-3.12.lock \
            --disable-pip --require-hashes --progress-spinner=off \
            --format cyclonedx-json \
            --output release-evidence/sbom-build-python-3.12.cdx.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = [
              *sorted(Path("dist").iterdir()),
              Path("release-evidence/sbom-build-python-3.12.cdx.json"),
          ]
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in paths
              if path.is_file()
          ]
          Path("release-evidence/SHA256SUMS").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
      - name: Retain distributions for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rulsafe-${{ github.event.release.tag_name }}-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Retain checksums and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rulsafe-${{ github.event.release.tag_name }}-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rulsafe
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rulsafe-${{ github.event.release.tag_name }}-distributions
          path: dist
      - name: Publish with a short-lived PyPI credential
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
