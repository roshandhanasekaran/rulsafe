name: Publish release

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Verify tag on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Install the audited environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/dev-${{ matrix.python-version }}.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test and audit the exact release commit
        run: |
          pytest
          pip-audit \
            --requirement requirements/dev-${{ matrix.python-version }}.lock \
            --disable-pip --require-hashes --progress-spinner=off

  build:
    name: Build and verify release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      distributions-artifact-id: ${{ steps.upload-distributions.outputs.artifact-id }}
      evidence-artifact-id: ${{ steps.upload-evidence.outputs.artifact-id }}
      wheel-sha256: ${{ steps.hashes.outputs.wheel-sha256 }}
      sdist-sha256: ${{ steps.hashes.outputs.sdist-sha256 }}
      sbom-sha256: ${{ steps.hashes.outputs.sbom-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the audited build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/dev-3.12.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify release provenance and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from importlib.metadata import version

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          expected_tag = f"v{version('rulsafe')}"
          tag = os.environ["RELEASE_TAG"]
          event_sha = os.environ["RELEASE_SHA"]
          head = git("rev-parse", "HEAD^{commit}")
          tag_sha = git("rev-parse", f"refs/tags/{tag}^{{commit}}")
          if tag != expected_tag:
              raise SystemExit(f"Release tag {tag!r} must equal {expected_tag!r}")
          if head != event_sha or tag_sha != event_sha:
              raise SystemExit(
                  f"Release provenance mismatch: {head=}, {tag_sha=}, {event_sha=}"
              )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", event_sha, "origin/main"],
              check=True,
          )
          PY
      - name: Install Gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Verify source and history
        run: |
          ruff check .
          ruff format --check .
          mypy src
          bandit -c .bandit -r src
          gitleaks detect --source . --log-opts=--all --redact --verbose --no-banner
      - name: Export clean source and build distributions
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir "${RUNNER_TEMP}/rulsafe-release-source"
          git archive --format=tar "${RELEASE_SHA}" | \
            tar --extract --file=- --directory="${RUNNER_TEMP}/rulsafe-release-source"
          python -m build --no-isolation \
            --outdir "${RUNNER_TEMP}/rulsafe-release-dist" \
            "${RUNNER_TEMP}/rulsafe-release-source"
      - name: Compare distributions with the release commit
        env:
          RELEASE_DIST: ${{ runner.temp }}/rulsafe-release-dist
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import stat
          import subprocess
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path
          from pathlib import PurePosixPath

          from packaging.utils import canonicalize_name
          from packaging.utils import parse_sdist_filename
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          dist = Path(os.environ["RELEASE_DIST"])
          release_sha = os.environ["RELEASE_SHA"]
          expected_name = canonicalize_name("rulsafe")
          expected_version = Version(os.environ["RELEASE_TAG"].removeprefix("v"))
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist: {wheels=}, {sdists=}")

          wheel_name, wheel_version, _, _ = parse_wheel_filename(wheels[0].name)
          sdist_name, sdist_version = parse_sdist_filename(sdists[0].name)
          if (wheel_name, wheel_version) != (expected_name, expected_version):
              raise SystemExit(f"Wheel filename does not match release: {wheels[0].name}")
          if (sdist_name, sdist_version) != (expected_name, expected_version):
              raise SystemExit(f"Sdist filename does not match release: {sdists[0].name}")

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_members = archive.infolist()
              wheel_names = [member.filename for member in wheel_members]
              if len(wheel_names) != len(set(wheel_names)):
                  raise SystemExit("Wheel contains duplicate member paths")
              unsafe_wheel = [
                  name
                  for name in wheel_names
                  if PurePosixPath(name).is_absolute()
                  or ".." in PurePosixPath(name).parts
              ]
              symlink_wheel = [
                  member.filename
                  for member in wheel_members
                  if stat.S_ISLNK(member.external_attr >> 16)
              ]
              metadata_names = [
                  name for name in wheel_names if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_names) != 1:
                  raise SystemExit(f"Expected one wheel METADATA file: {metadata_names}")
              wheel_metadata = BytesParser().parsebytes(archive.read(metadata_names[0]))
          forbidden_wheel = [
              name
              for name in wheel_names
              if name.endswith((".parquet", ".csv", ".zip", ".7z"))
          ]
          required_wheel = {
              "rulsafe/py.typed",
              "rulsafe/demo_configs/cmapss_fd001_completed_trajectory.yaml",
              "rulsafe/demo_configs/synthetic_fleet.yaml",
          }
          missing_wheel = required_wheel - set(wheel_names)
          wheel_metadata_identity = (
              canonicalize_name(wheel_metadata["Name"] or ""),
              Version(wheel_metadata["Version"] or "0"),
          )
          if wheel_metadata_identity != (expected_name, expected_version):
              raise SystemExit(f"Wheel metadata does not match release: {wheel_metadata_identity}")
          if forbidden_wheel or missing_wheel or unsafe_wheel or symlink_wheel:
              raise SystemExit(
                  f"Invalid wheel: {forbidden_wheel=}, {missing_wheel=}, "
                  f"{unsafe_wheel=}, {symlink_wheel=}"
              )

          tracked = set(
              subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", release_sha], text=True
              ).splitlines()
          )
          with tarfile.open(sdists[0]) as archive:
              all_members = archive.getmembers()
              member_names = [member.name for member in all_members]
              if len(member_names) != len(set(member_names)):
                  raise SystemExit("Sdist contains duplicate member paths")
              unexpected_types = [
                  member.name
                  for member in all_members
                  if not member.isfile() and not member.isdir()
              ]
              unsafe_sdist = [
                  name
                  for name in member_names
                  if PurePosixPath(name).is_absolute()
                  or ".." in PurePosixPath(name).parts
              ]
              if unexpected_types or unsafe_sdist:
                  raise SystemExit(
                      f"Invalid sdist members: {unexpected_types=}, {unsafe_sdist=}"
                  )
              expected_root = f"rulsafe-{expected_version}"
              roots = {member.name.split("/", 1)[0] for member in all_members}
              if roots != {expected_root}:
                  raise SystemExit(f"Unexpected sdist roots: {sorted(roots)}")
              root = expected_root
              members = [member for member in all_members if member.isfile()]
              pkg_info_name = f"{root}/PKG-INFO"
              pkg_info_members = [member for member in members if member.name == pkg_info_name]
              if len(pkg_info_members) != 1:
                  raise SystemExit(f"Expected one sdist PKG-INFO: {pkg_info_members}")
              pkg_info_file = archive.extractfile(pkg_info_members[0])
              if pkg_info_file is None:
                  raise SystemExit("Could not read sdist PKG-INFO")
              sdist_metadata = BytesParser().parsebytes(pkg_info_file.read())
              sdist_metadata_identity = (
                  canonicalize_name(sdist_metadata["Name"] or ""),
                  Version(sdist_metadata["Version"] or "0"),
              )
              if sdist_metadata_identity != (expected_name, expected_version):
                  raise SystemExit(
                      f"Sdist metadata does not match release: {sdist_metadata_identity}"
                  )
              packaged = {
                  member.name.removeprefix(f"{root}/"): member
                  for member in members
                  if member.name != pkg_info_name
              }
              if set(packaged) != tracked:
                  raise SystemExit(
                      f"Sdist file mismatch: extras={sorted(set(packaged) - tracked)}, "
                      f"missing={sorted(tracked - set(packaged))}"
                  )
              bad = [
                  name
                  for name in packaged
                  if any(
                      part in name
                      for part in (
                          ".hypothesis/",
                          ".pytest_cache/",
                          ".coverage",
                          "__pycache__/",
                          ".venv/",
                          ".git/",
                      )
                  )
              ]
              if bad:
                  raise SystemExit(f"Cache or environment files in sdist: {bad}")
              for name, member in packaged.items():
                  packaged_file = archive.extractfile(member)
                  if packaged_file is None:
                      raise SystemExit(f"Could not read sdist member {name}")
                  committed = subprocess.check_output(["git", "show", f"{release_sha}:{name}"])
                  if packaged_file.read() != committed:
                      raise SystemExit(f"Sdist member differs from release commit: {name}")
          PY
      - name: Install the built wheel outside the checkout
        env:
          RELEASE_DIST: ${{ runner.temp }}/rulsafe-release-dist
        run: |
          python -m venv "${RUNNER_TEMP}/rulsafe-release-wheel"
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements/dev-3.12.lock
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" -m pip install \
            --no-deps "${RELEASE_DIST}"/*.whl
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" \
            scripts/check_installed_distribution.py
          "${RUNNER_TEMP}/rulsafe-release-wheel/bin/python" -m pip check
      - name: Generate release evidence and trusted hashes
        id: hashes
        env:
          RELEASE_DIST: ${{ runner.temp }}/rulsafe-release-dist
          RELEASE_EVIDENCE: ${{ runner.temp }}/rulsafe-release-evidence
        run: |
          mkdir "${RELEASE_EVIDENCE}"
          pip-audit --requirement requirements/dev-3.12.lock \
            --disable-pip --require-hashes --progress-spinner=off \
            --format cyclonedx-json \
            --output "${RELEASE_EVIDENCE}/sbom-build-python-3.12.cdx.json"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          dist = Path(os.environ["RELEASE_DIST"])
          evidence = Path(os.environ["RELEASE_EVIDENCE"])
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          sbom = evidence / "sbom-build-python-3.12.cdx.json"
          hashes = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in (wheel, sdist, sbom)}
          (evidence / "SHA256SUMS").write_text(
              "".join(f"{digest}  {name}\n" for name, digest in hashes.items()),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"wheel-sha256={hashes[wheel.name]}\n")
              output.write(f"sdist-sha256={hashes[sdist.name]}\n")
              output.write(f"sbom-sha256={hashes[sbom.name]}\n")
          PY
      - name: Retain distributions for publishing
        id: upload-distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rulsafe-${{ github.event.release.tag_name }}-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rulsafe-release-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Retain checksums and SBOM
        id: upload-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rulsafe-${{ github.event.release.tag_name }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rulsafe-release-evidence/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rulsafe
    permissions:
      id-token: write
    steps:
      - name: Download distributions by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Download evidence by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.evidence-artifact-id }}
          merge-multiple: true
          path: evidence
      - name: Fail closed on transferred files and hashes
        env:
          EXPECTED_SDIST_SHA256: ${{ needs.build.outputs.sdist-sha256 }}
          EXPECTED_SBOM_SHA256: ${{ needs.build.outputs.sbom-sha256 }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          distributions=(dist/*)
          evidence_files=(evidence/*)
          [[ ${#wheels[@]} -eq 1 ]]
          [[ ${#sdists[@]} -eq 1 ]]
          [[ ${#distributions[@]} -eq 2 ]]
          [[ ${#evidence_files[@]} -eq 2 ]]
          [[ -f evidence/SHA256SUMS ]]
          [[ -f evidence/sbom-build-python-3.12.cdx.json ]]
          printf '%s  %s\n' "${EXPECTED_WHEEL_SHA256}" "${wheels[0]}" | sha256sum --check -
          printf '%s  %s\n' "${EXPECTED_SDIST_SHA256}" "${sdists[0]}" | sha256sum --check -
          printf '%s  %s\n' "${EXPECTED_SBOM_SHA256}" \
            evidence/sbom-build-python-3.12.cdx.json | sha256sum --check -
          cp "${wheels[0]}" "${sdists[0]}" evidence/
          (cd evidence && sha256sum --check SHA256SUMS)
          rm "evidence/$(basename "${wheels[0]}")" "evidence/$(basename "${sdists[0]}")"
      - name: Publish with a short-lived PyPI credential
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
